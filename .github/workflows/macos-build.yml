name: Build macOS Release

on:
  workflow_dispatch:      # manual trigger from the Actions tab


jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'   # pin to the version you develop with
          cache: true

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app (release)
        run: flutter build macos --release

      - name: Locate build output
        run: |
          ls -la build/macos/Build/Products/Release/
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app")
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Ad-hoc sign the app
        run: |
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --verbose "$APP_PATH"

      - name: Zip the .app properly (preserves permissions/metadata)
        run: |
          APP_NAME=$(basename "$APP_PATH")
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "Linea-macOS.zip"

      - name: Upload .app zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linea-macOS-app
          path: build/macos/Build/Products/Release/Linea-macOS.zip
          retention-days: 14

      - name: Generate .icns from app_icon.png
        run: |
          mkdir icon.iconset
          SRC="assets/icon/app_icon.png"

          sips -z 16 16     "$SRC" --out icon.iconset/icon_16x16.png
          sips -z 32 32     "$SRC" --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     "$SRC" --out icon.iconset/icon_32x32.png
          sips -z 64 64     "$SRC" --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   "$SRC" --out icon.iconset/icon_128x128.png
          sips -z 256 256   "$SRC" --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   "$SRC" --out icon.iconset/icon_256x256.png
          sips -z 512 512   "$SRC" --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   "$SRC" --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 "$SRC" --out icon.iconset/icon_512x512@2x.png

          iconutil -c icns icon.iconset -o volume_icon.icns

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          APP_NAME=$(basename "$APP_PATH")
          cd build/macos/Build/Products/Release

          create-dmg \
            --volname "Linea Installer" \
            --volicon "$GITHUB_WORKSPACE/volume_icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 150 190 \
            --app-drop-link 425 190 \
            "Linea.dmg" \
            "$APP_NAME" || true
          # create-dmg sometimes exits non-zero even on success; the file check below catches real failures

      - name: Verify DMG was created
        run: |
          test -f build/macos/Build/Products/Release/Linea.dmg && echo "DMG created successfully"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linea-macOS-dmg
          path: build/macos/Build/Products/Release/Linea.dmg
          retention-days: 14