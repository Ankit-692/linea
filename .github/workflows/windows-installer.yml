name: Build Windows Installer

on:
  workflow_dispatch:      # manual trigger from the Actions tab


jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Extract version from pubspec.yaml
        shell: pwsh
        run: |
          $verLine = Get-Content pubspec.yaml | Select-String "^version:\s*([^\s+]+)"
          $version = $verLine.Matches.Groups[1].Value.Trim()
          Write-Host "Detected version: $version"
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "windows\installer.iss"
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linea-Windows-${{ env.APP_VERSION }}-Setup
          path: windows/Output/*.exe